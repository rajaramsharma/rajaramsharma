<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rounded Circle Animation</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 50% 40%, #2a2a3a 0%, #0e0e16 70%);
    font-family: system-ui, sans-serif;
    overflow:hidden;
  }
  .stage { position:relative; width:340px; height:340px; display:flex; align-items:center; justify-content:center; }

  /* Rotating gradient ring */
  .ring {
    position:absolute; inset:0; border-radius:50%;
    background: conic-gradient(from 0deg, #e23636, #ff8a3d, #ffd23d, #36e2a0, #3da0ff, #a03dff, #e23636);
    animation: spin 6s linear infinite;
    filter: blur(2px);
  }
  /* Pulsing glow */
  .glow {
    position:absolute; inset:-18px; border-radius:50%;
    background: conic-gradient(from 0deg, #e23636, #ff8a3d, #ffd23d, #36e2a0, #3da0ff, #a03dff, #e23636);
    animation: spin 6s linear infinite, pulse 2.4s ease-in-out infinite;
    filter: blur(22px); opacity:.65; z-index:-1;
  }
  /* White gap */
  .gap {
    position:absolute; inset:10px; border-radius:50%;
    background: radial-gradient(circle at 50% 40%, #2a2a3a 0%, #14141e 100%);
  }

  /* Orbiting dots */
  .orbit { position:absolute; inset:-4px; border-radius:50%; animation: spin 9s linear infinite; }
  .orbit.rev { animation: spinRev 12s linear infinite; }
  .dot { position:absolute; top:-5px; left:50%; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:#fff; box-shadow:0 0 12px #fff; }
  .orbit.rev .dot { background:#ffd23d; box-shadow:0 0 12px #ffd23d; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinRev { to { transform: rotate(-360deg); } }
  @keyframes pulse { 0%,100% { transform:scale(1); opacity:.5; } 50% { transform:scale(1.08); opacity:.8; } }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
